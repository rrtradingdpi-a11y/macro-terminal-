<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AITOS Dynamic Cycle Scanner — Live Levels</title>
  <style>
    :root {
      --bg: #090c10;
      --panel: #11151f;
      --panel-alt: #161c2b;
      --border: #1e2638;
      --accent: #2563eb;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #8492a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Command Header */
    header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 6px 10px; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
    .badge-live { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: 700; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Navigation */
    .view-toggle { display: flex; gap: 4px; background: #0c0f17; padding: 2px; border-radius: 6px; border: 1px solid var(--border); }
    .toggle-btn { background: transparent; border: none; color: var(--text-muted); font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .toggle-btn.active { background: #1e2638; color: #fff; }

    .ticker-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
    .tab-btn { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Workspace */
    .workspace { display: flex; flex: 1; min-height: 0; position: relative; }
    .chart-container { flex: 1; height: 100%; position: relative; }

    /* Sidebar */
    .sidebar { width: 340px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px; gap: 10px; overflow-y: auto; }
    .section-title { font-size: 10px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 0.8px; margin-bottom: 5px; }

    /* Active Matrix Card */
    .exec-card { background: var(--panel-alt); border: 1px solid var(--border); border-radius: 7px; padding: 10px; transition: border 0.3s; }
    .exec-card.hit-tp { border-color: var(--green); }
    .exec-card.hit-sl { border-color: var(--red); }
    
    .exec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .order-type-badge { font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; }
    .order-type-badge.buy { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
    .order-type-badge.sell { background: rgba(244, 63, 94, 0.2); color: var(--red); border: 1px solid var(--red); }

    /* Flash Status */
    .status-alert { font-size: 11px; font-weight: 700; padding: 6px; border-radius: 4px; text-align: center; margin-bottom: 8px; display: none; }
    .status-alert.win { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); display: block; }
    .status-alert.loss { background: rgba(244, 63, 94, 0.2); color: var(--red); border: 1px solid var(--red); display: block; }

    .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .param-box { background: #0c0f17; border: 1px solid #1a2234; padding: 6px 8px; border-radius: 5px; }
    .param-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .param-val { font-size: 13px; font-weight: 800; margin-top: 2px; }

    /* Live Live Price Counter */
    .live-tick-box { background: #0c0f17; border: 1px solid #1e2638; border-radius: 5px; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }

    /* Scanner Table */
    .scanner-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .scanner-table th { text-align: left; color: var(--text-muted); font-size: 9px; padding: 4px 6px; border-bottom: 1px solid var(--border); }
    .scanner-table td { padding: 6px 6px; border-bottom: 1px solid #161e30; }
    .status-pill { font-size: 9px; padding: 2px 5px; border-radius: 3px; font-weight: 700; text-transform: uppercase; display: inline-block; }
    .pill-ready { background: rgba(16, 185, 129, 0.2); color: var(--green); }
    .pill-building { background: rgba(245, 158, 11, 0.2); color: var(--gold); }

    .tape-container { height: 36px; border-top: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }

    @media (max-width: 768px) {
      .workspace { flex-direction: column; overflow-y: auto; }
      .chart-container { flex: none; height: 50vh; width: 100%; }
      .sidebar { width: 100%; border-left: none; border-top: 1px solid var(--border); flex: 1; overflow-y: visible; }
      body.mode-chart .chart-container { height: 100%; }
      body.mode-chart .sidebar { display: none; }
      body.mode-scanner .chart-container { display: none; }
      body.mode-scanner .sidebar { display: flex; height: 100%; }
    }
  </style>
</head>
<body class="mode-split">

  <!-- Header -->
  <header>
    <div class="header-top">
      <div class="brand">
        <span>AITOS AUTOCYCLE OS</span>
        <span class="badge-live">● TICK STREAM</span>
      </div>
      <div class="view-toggle">
        <button class="toggle-btn" onclick="setViewMode('chart', this)">CHART</button>
        <button class="toggle-btn active" onclick="setViewMode('split', this)">SPLIT</button>
        <button class="toggle-btn" onclick="setViewMode('scanner', this)">SCANNER</button>
      </div>
    </div>

    <div class="ticker-bar">
      <button class="tab-btn active" onclick="switchAsset('XAUUSD', this)">XAUUSD (Gold)</button>
      <button class="tab-btn" onclick="switchAsset('US30', this)">US30 (Dow 30)</button>
      <button class="tab-btn" onclick="switchAsset('BTCUSD', this)">BTCUSD</button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="workspace">
    <!-- Chart Box -->
    <div class="chart-container" id="tv_chart_container"></div>

    <!-- Real-Time Auto-Updating Sidebar -->
    <div class="sidebar">

      <!-- Live Tick Box -->
      <div class="live-tick-box">
        <div>
          <span style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">Real-Time Price:</span>
          <b id="live_tick_price" style="font-size: 14px; margin-left: 6px; color:#fff;">--</b>
        </div>
        <div style="font-size: 10px; color: var(--green); font-weight: 700;">STREAMING</div>
      </div>

      <!-- Hit Notice Alert (Hidden until TP/SL Hit) -->
      <div id="hit_alert_box" class="status-alert"></div>

      <!-- Active Execution Box -->
      <div>
        <div class="section-title">Active Setup Matrix</div>
        <div class="exec-card" id="exec_card_wrapper">
          <div class="exec-header">
            <div>
              <span id="active_symbol_label" style="font-size: 13px; font-weight: 800;">XAUUSD</span>
              <span style="font-size: 10px; color: var(--text-muted); margin-left: 4px;" id="cycle_count_label">Cycle #1</span>
            </div>
            <span class="order-type-badge buy" id="exec_type_badge">BUY LIMIT</span>
          </div>

          <div class="param-grid">
            <div class="param-box">
              <div class="param-label">Entry Level</div>
              <div class="param-val" id="val_entry" style="color: var(--accent);">--</div>
            </div>
            <div class="param-box">
              <div class="param-label">Stop Loss</div>
              <div class="param-val" id="val_sl" style="color: var(--red);">--</div>
            </div>
            <div class="param-box">
              <div class="param-label">Target 1 (TP1)</div>
              <div class="param-val" id="val_tp1" style="color: var(--green);">--</div>
            </div>
            <div class="param-box">
              <div class="param-label">Target 2 (TP2)</div>
              <div class="param-val" id="val_tp2" style="color: var(--green);">--</div>
            </div>
          </div>

          <div style="margin-top: 8px; font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between;">
            <span>Risk / Reward: <b style="color:#fff;" id="val_rr">1 : 2.5</b></span>
            <span>Status: <b style="color:var(--green);" id="val_status">ARMED</b></span>
          </div>
        </div>
      </div>

      <!-- Scanner Table -->
      <div>
        <div class="section-title">Institutional Scanner Overview</div>
        <div class="exec-card" style="padding: 6px;">
          <table class="scanner-table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Setup</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="scanner_body"></tbody>
          </table>
        </div>
      </div>

      <!-- Action Simulation (For Testing Cycle Resets Instantly) -->
      <div>
        <div class="section-title">Manual State Simulator</div>
        <div style="display:flex; gap:6px;">
          <button onclick="simulateHit('TP')" style="flex:1; background:rgba(16,185,129,0.2); border:1px solid var(--green); color:var(--green); font-size:10px; font-weight:800; padding:6px; border-radius:4px; cursor:pointer;">FORCE TP HIT</button>
          <button onclick="simulateHit('SL')" style="flex:1; background:rgba(244,63,94,0.2); border:1px solid var(--red); color:var(--red); font-size:10px; font-weight:800; padding:6px; border-radius:4px; cursor:pointer;">FORCE SL HIT</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Bottom Market Ticker Tape -->
  <div class="tape-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>

  </div>
